<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wislainy e o gato</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FFF0F6; --rosa:#FF4D94; --claro:#F9A8D4; --texto:#7A3B5C; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--texto); font-family:'Fira Code',monospace; }
  main { position:fixed; top:0; left:0; right:0; padding:28px 20px; text-align:center; pointer-events:none; }
  h1 { margin:0 0 6px; font-size:clamp(20px,4vw,32px); color:var(--rosa); }
  p { margin:0; font-size:14px; }
  button { pointer-events:auto; margin-top:14px; font:600 14px 'Fira Code',monospace; color:#fff; background:var(--rosa); border:0; border-radius:999px; padding:10px 20px; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--texto); outline-offset:3px; }
  #cat { position:fixed; top:0; left:0; width:170px; height:146px; cursor:pointer; will-change:transform; }
  #cat svg { width:100%; height:100%; overflow:visible; }
  #flip { transform-origin:0 0; }
  .leg, .tail { transform-box:view-box; }
  .walk .leg.a { animation:passo .35s infinite; }
  .walk .leg.b { animation:passo .35s infinite reverse; }
  .tail { animation:rabo 1.8s infinite; }
  .sleep .tail { animation-duration:5s; }
  @keyframes passo { 0%,100%{transform:rotate(-26deg)} 50%{transform:rotate(26deg)} }
  @keyframes rabo { 0%,100%{transform:rotate(-14deg)} 50%{transform:rotate(14deg)} }
  #zzz { display:none; fill:var(--rosa); font:600 18px 'Fira Code',monospace; }
  .sleep #zzz { display:block; }
  .sleep .olho { display:none; }
  .fx { position:fixed; pointer-events:none; font-size:26px; animation:sobe 1.2s forwards; }
  .fala { font:600 13px 'Fira Code',monospace; background:#fff; color:var(--texto); border:2px solid var(--rosa); border-radius:12px; padding:4px 10px; }
  @keyframes sobe { to { transform:translateY(-90px); opacity:0; } }
  @media (prefers-reduced-motion:reduce) { .walk .leg, .tail { animation:none; } }
</style>
</head>
<body>
<main>
  <h1>Clique em qualquer lugar</h1>
  <p>O gato pula até lá. Passe o mouse nele, clique nele ou aperte espaço para ele pular.</p>
  <button id="seguir" aria-pressed="false">Seguir o mouse: desligado</button>
</main>

<div id="cat" role="img" aria-label="Gato preto">
  <svg viewBox="-70 -90 140 110">
    <g id="flip">
      <g class="tail" style="transform-origin:-30px -34px">
        <path d="M-30 -34 C-46 -36 -56 -52 -48 -70" fill="none" stroke="#FF69B4" stroke-width="9" stroke-linecap="round"/>
        <path d="M-30 -34 C-46 -36 -56 -52 -48 -70" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g class="leg a" style="transform-origin:-22px -16px"><line x1="-22" y1="-16" x2="-22" y2="4" stroke="#FF69B4" stroke-width="9" stroke-linecap="round"/><line x1="-22" y1="-16" x2="-22" y2="4" stroke="#111" stroke-width="6" stroke-linecap="round"/></g>
      <g class="leg b" style="transform-origin:-8px -16px"><line x1="-8" y1="-16" x2="-8" y2="4" stroke="#FF69B4" stroke-width="9" stroke-linecap="round"/><line x1="-8" y1="-16" x2="-8" y2="4" stroke="#111" stroke-width="6" stroke-linecap="round"/></g>
      <ellipse cx="0" cy="-30" rx="34" ry="18" fill="#111" stroke="#FF69B4" stroke-width="1.5"/>
      <g class="leg b" style="transform-origin:12px -16px"><line x1="12" y1="-16" x2="12" y2="4" stroke="#FF69B4" stroke-width="9" stroke-linecap="round"/><line x1="12" y1="-16" x2="12" y2="4" stroke="#111" stroke-width="6" stroke-linecap="round"/></g>
      <g class="leg a" style="transform-origin:26px -16px"><line x1="26" y1="-16" x2="26" y2="4" stroke="#FF69B4" stroke-width="9" stroke-linecap="round"/><line x1="26" y1="-16" x2="26" y2="4" stroke="#111" stroke-width="6" stroke-linecap="round"/></g>
      <polygon points="27,-56 29,-74 40,-59" fill="#111" stroke="#FF69B4" stroke-width="1.5" stroke-linejoin="round"/>
      <polygon points="42,-59 51,-74 53,-55" fill="#111" stroke="#FF69B4" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="40" cy="-46" r="15" fill="#111" stroke="#FF69B4" stroke-width="1.5"/>
      <circle class="olho" cx="35" cy="-48" r="2.6" fill="#FF4D94"/>
      <circle class="olho" cx="47" cy="-48" r="2.6" fill="#FF4D94"/>
      <circle cx="52" cy="-43" r="1.6" fill="#F9A8D4"/>
    </g>
    <text id="zzz" x="50" y="-76">z z z</text>
  </svg>
</div>

<script>
const cat = document.getElementById('cat');
const flip = document.getElementById('flip');
const btn = document.getElementById('seguir');
let x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y;
let seguir = false, dir = 1, ultimo = performance.now(), parado = 0;
let pulando = false, jt = 0, fase = 0, cooldown = 0;

function acordar() { parado = 0; cat.classList.remove('sleep'); }

function pular() {
  if (pulando) return;
  pulando = true; jt = 0; acordar();
}

function efeito(emoji, px, py) {
  const e = document.createElement('div');
  e.className = 'fx';
  e.textContent = emoji;
  e.style.left = (px + (Math.random() * 60 - 30)) + 'px';
  e.style.top = py + 'px';
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 1200);
}

function fala(texto) {
  const f = document.createElement('div');
  f.className = 'fala fx';
  f.textContent = texto;
  f.style.left = (x - 20) + 'px';
  f.style.top = (y - 130) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1200);
}

document.addEventListener('click', e => {
  if (e.target === btn) return;
  acordar();
  if (cat.contains(e.target)) {
    const frases = ['miau!', 'purr purr', 'mrrrau', 'mais carinho!'];
    fala(frases[Math.floor(Math.random() * frases.length)]);
    pular();
    for (let i = 0; i < 4; i++) setTimeout(() => efeito('💗', x, y - 70), i * 120);
  } else {
    tx = e.clientX; ty = e.clientY;
    efeito('🐾', tx, ty);
  }
});

cat.addEventListener('mouseenter', () => {
  const agora = performance.now();
  if (agora < cooldown) return;
  cooldown = agora + 1500;
  pular();
});

document.addEventListener('mousemove', e => {
  if (!seguir) return;
  acordar();
  tx = e.clientX; ty = e.clientY;
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    pular();
    efeito('✨', x, y - 90);
  }
});

btn.addEventListener('click', () => {
  seguir = !seguir;
  btn.setAttribute('aria-pressed', seguir);
  btn.textContent = 'Seguir o mouse: ' + (seguir ? 'ligado' : 'desligado');
});

function loop(t) {
  const dt = Math.min((t - ultimo) / 1000, 0.05);
  ultimo = t;
  const dx = tx - x, dy = ty - y, dist = Math.hypot(dx, dy);
  let salto = 0;

  if (dist > 6) {
    const v = Math.min(210 * dt, dist);
    x += dx / dist * v; y += dy / dist * v;
    fase += v / 38;
    salto -= Math.abs(Math.sin(fase)) * 30;
    if (Math.abs(dx) > 3) dir = dx > 0 ? 1 : -1;
    cat.classList.add('walk');
    acordar();
  } else {
    cat.classList.remove('walk');
    parado += dt;
    if (parado > 8) cat.classList.add('sleep');
  }

  if (pulando) {
    jt += dt;
    const p = Math.min(jt / 0.55, 1);
    salto -= Math.sin(p * Math.PI) * 90;
    if (p >= 1) pulando = false;
  }

  flip.style.transform = 'scaleX(' + dir + ')';
  cat.style.transform = 'translate(' + (x - 85) + 'px,' + (y - 110 + salto) + 'px)';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
