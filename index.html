<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página oficial da Wislainy</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FFF0F6; --rosa:#FF4D94; --claro:#F9A8D4; --texto:#7A3B5C; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--texto); font-family:'Fira Code',monospace; }
  main { position:fixed; top:0; left:0; right:0; padding:28px 20px; text-align:center; pointer-events:none; }
  h1 { margin:0 0 6px; font-size:clamp(20px,4vw,34px); color:var(--rosa); }
  .sub { margin:0 0 10px; font-size:clamp(14px,2.4vw,18px); font-weight:600; }
  p { margin:0; font-size:13px; }
  button { pointer-events:auto; margin-top:14px; font:600 14px 'Fira Code',monospace; color:#fff; background:var(--rosa); border:0; border-radius:999px; padding:10px 20px; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--texto); outline-offset:3px; }
  #chao { position:fixed; left:0; right:0; bottom:0; height:14px; background:var(--claro); }

  #cor { position:fixed; left:0; bottom:14px; display:flex; flex-direction:column; align-items:center; cursor:pointer; will-change:transform; transform-origin:50% 100%; user-select:none; }
  #cor img { position:relative; z-index:1; height:150px; width:auto; -webkit-user-drag:none; pointer-events:none; }
  #cor svg { width:90px; height:72px; margin-top:-8px; overflow:visible; pointer-events:none; }
  .perna { transform-box:view-box; }
  .anda .perna.a { animation:perna .6s infinite; }
  .anda .perna.b { animation:perna .6s infinite reverse; }
  @keyframes perna { 0%,100%{transform:rotate(-30deg)} 50%{transform:rotate(30deg)} }

  #cat { position:fixed; top:0; left:0; width:170px; height:146px; cursor:pointer; will-change:transform; }
  #cat svg { width:100%; height:100%; overflow:visible; }
  #flip { transform-origin:0 0; }
  .leg, .tail { transform-box:view-box; }
  .walk .leg.a { animation:passo .35s infinite; }
  .walk .leg.b { animation:passo .35s infinite reverse; }
  .tail { animation:rabo 1.8s infinite; }
  .sleep .tail { animation-duration:5s; }
  @keyframes passo { 0%,100%{transform:rotate(-26deg)} 50%{transform:rotate(26deg)} }
  @keyframes rabo { 0%,100%{transform:rotate(-14deg)} 50%{transform:rotate(14deg)} }
  #zzz { display:none; fill:var(--rosa); font:600 18px 'Fira Code',monospace; }
  .sleep #zzz { display:block; }
  .sleep .olho { display:none; }

  .fx { position:fixed; pointer-events:none; font-size:26px; animation:sobe 1.2s forwards; }
  @keyframes sobe { to { transform:translateY(-90px); opacity:0; } }
  .fala.fx { font:600 14px/1.4 'Fira Code',monospace; background:#fff; color:var(--texto); border:2px solid var(--rosa); border-radius:14px; padding:8px 14px; max-width:270px; text-align:center; animation:fica 4.5s forwards; }
  @keyframes fica { 0%{opacity:0; transform:translateY(8px)} 8%{opacity:1; transform:translateY(0)} 90%{opacity:1} 100%{opacity:0; transform:translateY(-12px)} }
  @media (prefers-reduced-motion:reduce) { .walk .leg, .tail, .anda .perna { animation:none; } }
</style>
</head>
<body>
<main>
  <h1>Página oficial da Wislainy</h1>
  <p class="sub">a engenheira de software hardcore 💗</p>
  <p>Clique em qualquer lugar e o gato pula até lá. Clique na Coraline
